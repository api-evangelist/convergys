name: Convergys
kind: company
description: >-
  Convergys Corporation was a global leader in customer management services —
  contact center outsourcing, workforce management, customer analytics and digital
  customer experience platforms — serving communications, financial services,
  healthcare, retail and technology clients. SYNNEX acquired Convergys in October
  2018 and merged it into Concentrix; the brand was retired and its offerings were
  folded into the Concentrix portfolio. Convergys published no public API or
  developer program that survives. Probed 2026-09-07: www.convergys.com is an Azure
  App Service redirect app that has been switched off and now answers "403 Site
  Disabled" on every path with an expired TLS certificate, and developer.convergys.com
  still resolves to an address block registered to Concentrix CVG Brite Voice Systems
  LLC with both HTTP ports closed. The successor company, Concentrix, is profiled
  separately and delivers most platform integration through enterprise contracts
  rather than a public developer program.
