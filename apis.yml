  reason: defunct
  detail: >-
    Convergys was merged into Concentrix in October 2018 and its own web estate has
    since been switched off — www.convergys.com is an Azure App Service redirect app
    that now answers "403 Site Disabled" on every path (including a control path that
    cannot exist) behind an expired TLS certificate, and developer.convergys.com still
    resolves to a Concentrix CVG Brite Voice Systems address block with TCP 80 and 443
    both closed, so there is no surviving Convergys host left to read a contract from.
